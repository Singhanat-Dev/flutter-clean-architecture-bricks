name: bloc_feature
description: Flutter BLoC Clean Architecture feature brick
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.26 <0.2.0"

vars:
  feature_name:
    type: string
    description: The name of the feature (e.g. auth, profile, product)
    prompt: What is the feature name?
  page_name:
    type: string
    description: The name of the initial page in this feature (e.g. login, list, detail)
    prompt: What is the initial page name?
